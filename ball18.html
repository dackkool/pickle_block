<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>寶石方塊 - 梯形校正版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#game-container{display:flex;width:100vw;height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)}
header{width:280px;display:flex;flex-direction:column;background:rgba(0,0,0,0.75);border-right:2px solid rgba(255,255,255,0.1);padding:10px;gap:8px;z-index:10}
header.big{width:92vw;max-width:520px;position:fixed;left:0;top:0;bottom:0;height:100vh;z-index:90;background:#000}
#camera-box{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden;border:2px solid #00ff00;touch-action:none}
header.big #camera-box{height:70vh;aspect-ratio:auto}
#webcam-preview{width:100%;height:100%;display:block;transform:scaleX(-1);background:#111}
#roi-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.handle{position:absolute;width:30px;height:30px;background:#ffd700;border:3px solid #000;border-radius:50%;transform:translate(-50%,-50%);z-index:20}
.color-row{display:flex;gap:5px}
.color-btn{flex:1;padding:6px 0;border-radius:7px;border:2px solid #333;font-weight:bold;color:#fff}
.color-btn.on{border-color:#fff}
.btn-small{width:100%;background:#222;color:#fff;border:1px solid #555;padding:7px;border-radius:8px;font-size:0.8rem}
#board-wrapper{flex:1;display:flex;justify-content:center;align-items:center;position:relative;background:#0a0f1f}
canvas#gameCanvas{display:block;background:#111;border-radius:8px}
#hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:14px;background:rgba(0,0,0,0.7);padding:6px 16px;border-radius:18px;color:#fff;font-weight:bold;z-index:5}
#hud b{color:#ffd700}
#overlay{position:fixed;inset:0;background:rgba(10,10,20,0.92);display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;z-index:99999;text-align:center;padding:20px}
.btn{background:linear-gradient(135deg,#ff416c,#ff4b2b);color:white;border:none;padding:16px 45px;font-size:1.3rem;font-weight:bold;border-radius:30px;cursor:pointer}
</style>
</head>
<body>
<video id="webcam" autoplay playsinline muted style="display:none"></video>
<div id="game-container">
<header id="mainHeader">
<div id="camera-box">
<canvas id="webcam-preview"></canvas>
<svg id="roi-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon id="roi-poly" points="15,15 85,15 85,85 15,85" fill="rgba(255,215,0,0.18)" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4 3"/></svg>
<div class="handle" data-i="0"></div><div class="handle" data-i="1"></div><div class="handle" data-i="2"></div><div class="handle" data-i="3"></div>
</div>
<button class="btn-small" id="calib-btn">🔍 放大校正</button>
<div class="color-row">
<button class="color-btn on" data-c="green" style="background:#22c55e">綠</button>
<button class="color-btn" data-c="red" style="background:#ef4444">紅</button>
<button class="color-btn" data-c="blue" style="background:#3b82f6">藍</button>
<button class="color-btn" data-c="yellow" style="background:#eab308;color:#000">黃</button>
</div>
<button class="btn-small" id="reset-btn">↩️ 重置梯形</button>
<div class="stat-box" id="cam-status" style="font-size:11px;color:#aaa;background:rgba(255,255,255,0.08);padding:6px;border-radius:6px;text-align:center">未開啟</div>
<div style="display:none"><span id="score">0</span><span id="timer">02:00</span></div>
</header>
<div id="board-wrapper">
<div id="hud">🏆 <b id="hud-score">0</b> ⏱️ <b id="hud-timer">02:00</b></div>
<canvas id="gameCanvas"></canvas>
</div>
</div>
<div id="overlay">
<h1>寶石方塊 - 梯形校正版</h1>
<p style="margin:10px 0;font-size:14px;line-height:1.6">1. 揀波色 2. 按放大校正拖黃點<br>3. 請用 Chrome / Safari 開，唔好喺 WhatsApp 入面開</p>
<button class="btn" id="start-btn">開啟後置鏡頭開始</button>
<p id="debug" style="color:#ff6666;margin-top:10px;font-size:12px"></p>
</div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),video=document.getElementById('webcam'),previewCanvas=document.getElementById('webcam-preview'),previewCtx=previewCanvas.getContext('2d');
const COLS=10,ROWS=7; let tileSize=40;
const GEM_COLORS=[
{main:'#ff6b81',dark:'#cc3355',emoji:'🐱'},
{main:'#70a1ff',dark:'#3366cc',emoji:'🐶'},
{main:'#7bed9f',dark:'#33aa55',emoji:'🐸'},
{main:'#ffa502',dark:'#cc8400',emoji:'🐯'},
{main:'#a55eea',dark:'#7a33cc',emoji:'🐰'}
];
let board=[],score=0,timeLeft=120,gameInterval=null,isPlaying=false,particles=[],ballX=-100,ballY=-100,lastHitTime=0;
let quad=[{x:0.15,y:0.15},{x:0.85,y:0.15},{x:0.85,y:0.85},{x:0.15,y:0.85}];
let homography=null; let selectedColor='green';

function resizeCanvas(){const w=document.getElementById('board-wrapper'); const maxW=w.clientWidth-20||800, maxH=w.clientHeight-20||500; tileSize=Math.floor(Math.min(maxW/COLS,maxH/ROWS)); canvas.width=COLS*tileSize; canvas.height=ROWS*tileSize; previewCanvas.width=320; previewCanvas.height=240; updateHandles();}
window.addEventListener('resize',resizeCanvas);

async function setupCamera(){
 const status=document.getElementById('cam-status'); const debug=document.getElementById('debug');
 try{
  let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
  video.srcObject=stream; await video.play().catch(()=>{});
  status.innerText='鏡頭已開啟 '+selectedColor+'波'; status.style.color='#0f0';
  requestAnimationFrame(trackLoop);
 }catch(e){
  status.innerText='鏡頭失敗: '+e.name; status.style.color='#f66';
  debug.innerText='鏡頭失敗: '+e.message+'\n請複製連結去 Chrome 開，確保係 https';
  // 鏡頭失敗都唔 block game
 }
}
const procCanvas=document.createElement('canvas'),procCtx=procCanvas.getContext('2d',{willReadFrequently:true}); procCanvas.width=160; procCanvas.height=120;
function computeHomography(){
 const src=quad.map(p=>({x:p.x*procCanvas.width, y:p.y*procCanvas.height}));
 const dst=[{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:0,y:1}];
 let A=[],b=[]; for(let i=0;i<4;i++){const sx=src[i].x,sy=src[i].y,dx=dst[i].x,dy=dst[i].y;A.push([sx,sy,1,0,0,0,-dx*sx,-dx*sy]);b.push(dx);A.push([0,0,0,sx,sy,1,-dy*sx,-dy*sy]);b.push(dy);}
 let n=8; for(let i=0;i<n;i++){let m=i;for(let r=i;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];for(let r=i+1;r<n;r++){let f=A[r][i]/(A[i][i]||1);for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i];}}
 let h=new Array(8).fill(0);for(let i=7;i>=0;i--){let s=b[i];for(let c=i+1;c<8;c++)s-=A[i][c]*h[c];h[i]=s/(A[i][i]||1);} homography={h00:h[0],h01:h[1],h02:h[2],h10:h[3],h11:h[4],h12:h[5],h20:h[6],h21:h[7],h22:1};
}
function mapPoint(x,y){ if(!homography) return null; const h=homography; const d=h.h20*x+h.h21*y+h.h22; if(Math.abs(d)<1e-6) return null; return {u:(h.h00*x+h.h01*y+h.h02)/d, v:(h.h10*x+h.h11*y+h.h12)/d}; }
function isBall(r,g,b){
 if(selectedColor==='green') return g>80 && r>40 && b<140;
 if(selectedColor==='red') return r>130 && g<120 && b<120;
 if(selectedColor==='blue') return b>100 && r<120;
 if(selectedColor==='yellow') return r>140 && g>120 && b<130;
 return false;
}
function trackLoop(){
 if(video.readyState>=2){
  previewCtx.save(); previewCtx.scale(-1,1); previewCtx.drawImage(video, -previewCanvas.width, 0, previewCanvas.width, previewCanvas.height); previewCtx.restore();
  procCtx.drawImage(video,0,0,procCanvas.width,procCanvas.height);
  const data=procCtx.getImageData(0,0,procCanvas.width,procCanvas.height).data;
  let tx=0,ty=0,cnt=0;
  for(let y=0;y<procCanvas.height;y+=2){ for(let x=0;x<procCanvas.width;x+=2){ const i=(y*procCanvas.width+x)*4; if(isBall(data[i],data[i+1],data[i+2])){tx+=x;ty+=y;cnt++;}}}
  if(cnt>10){
   const m=mapPoint(tx/cnt,ty/cnt);
   if(m && m.u>=0 && m.u<=1 && m.v>=0 && m.v<=1){
    ballX=(1-m.u)*canvas.width; ballY=m.v*canvas.height;
    if(isPlaying && Date.now()-lastHitTime>250){ checkHit(ballX,ballY); lastHitTime=Date.now(); }
   }
   previewCtx.fillStyle='#0f0'; previewCtx.beginPath(); previewCtx.arc((1-(tx/cnt)/procCanvas.width)*previewCanvas.width, (ty/cnt)/procCanvas.height*previewCanvas.height,6,0,Math.PI*2); previewCtx.fill();
  } else ballX=-100;
 }
 requestAnimationFrame(trackLoop);
}
function checkHit(x,y){const c=Math.floor(x/tileSize),r=Math.floor(y/tileSize); if(r>=0&&r<ROWS&&c>=0&&c<COLS&&board[r][c]!==null) destroySingle(r,c);}
function updateHandles(){document.querySelectorAll('.handle').forEach((el,i)=>{el.style.left=quad[i].x*100+'%';el.style.top=quad[i].y*100+'%';});document.getElementById('roi-poly').setAttribute('points',quad.map(p=>`${p.x*100},${p.y*100}`).join(' '));computeHomography();}
(function(){
 const box=document.getElementById('camera-box'); let a=-1;
 document.querySelectorAll('.handle').forEach(h=>{h.addEventListener('pointerdown',e=>{a=parseInt(h.dataset.i);h.setPointerCapture(e.pointerId);});});
 window.addEventListener('pointermove',e=>{if(a>=0){const r=box.getBoundingClientRect(); quad[a]={x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)), y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}; updateHandles();}});
 window.addEventListener('pointerup',()=>a=-1);
})();
async function startGame(){
 // 1. 即刻開 game，唔等鏡頭
 document.getElementById('overlay').style.display='none';
 score=0; timeLeft=120;
 document.getElementById('score').innerText=0; document.getElementById('hud-score').innerText=0;
 initBoard(); isPlaying=true;
 if(gameInterval) clearInterval(gameInterval);
 gameInterval=setInterval(()=>{timeLeft--; const m=Math.floor(timeLeft/60),s=timeLeft%60; const t=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; document.getElementById('timer').innerText=t; document.getElementById('hud-timer').innerText=t; if(timeLeft<=0) endGame();},1000);
 requestAnimationFrame(gameLoop);
 // 2. 鏡頭後面先試，失敗都唔影響
 setupCamera();
}
function endGame(){isPlaying=false;clearInterval(gameInterval);document.getElementById('overlay').innerHTML='<h1>結束 得分 '+score+'</h1><button class="btn" onclick="location.reload()">再玩一次</button>';document.getElementById('overlay').style.display='flex';}
function initBoard(){resizeCanvas(); board=[]; for(let r=0;r<ROWS;r++){board[r]=[]; for(let c=0;c<COLS;c++) board[r][c]=Math.floor(Math.random()*GEM_COLORS.length);} }
function destroySingle(r,c){score+=10;document.getElementById('score').innerText=score;document.getElementById('hud-score').innerText=score;createParticles(c*tileSize+tileSize/2,r*tileSize+tileSize/2,GEM_COLORS[board[r][c]].main);board[r][c]=null;for(let rr=r;rr>0;rr--)board[rr][c]=board[rr-1][c];board[0][c]=Math.floor(Math.random()*GEM_COLORS.length);}
function createParticles(x,y,color){for(let i=0;i<8;i++){const a=Math.random()*Math.PI*2,s=Math.random()*3+1;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,alpha:1,decay:0.05});}}
function drawGem(x,y,size,obj){const s=size*0.82;ctx.save();ctx.translate(x,y);ctx.fillStyle=obj.dark;ctx.fillRect(-s/2+2,-s/2+3,s,s);ctx.fillStyle=obj.main;ctx.fillRect(-s/2,-s/2,s,s);ctx.font=Math.floor(s*0.55)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(obj.emoji,0,s*0.12);ctx.restore();}
function update(){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.alpha-=p.decay;if(p.alpha<=0)particles.splice(i,1);}}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ctx.fillStyle=(r+c)%2?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.15)';ctx.fillRect(c*tileSize,r*tileSize,tileSize,tileSize);if(board[r][c]!==null)drawGem(c*tileSize+tileSize/2,r*tileSize+tileSize/2,tileSize,GEM_COLORS[board[r][c]]);}for(let p of particles){ctx.globalAlpha=p.alpha;ctx.fillStyle=p.color;ctx.fillRect(p.x-2,p.y-2,4,4);}ctx.globalAlpha=1;if(ballX>0){ctx.strokeStyle='#00ff00';ctx.lineWidth=3;ctx.beginPath();ctx.arc(ballX,ballY,18,0,Math.PI*2);ctx.stroke();}}
function gameLoop(){update();draw();if(isPlaying)requestAnimationFrame(gameLoop);}
document.getElementById('start-btn').addEventListener('click',startGame);
document.getElementById('reset-btn').addEventListener('click',()=>{quad=[{x:0.15,y:0.15},{x:0.85,y:0.15},{x:0.85,y:0.85},{x:0.15,y:0.85}];updateHandles();});
document.getElementById('calib-btn').addEventListener('click',()=>{document.getElementById('mainHeader').classList.toggle('big');setTimeout(resizeCanvas,300);});
document.querySelectorAll('.color-btn').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.color-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');selectedColor=b.dataset.c;document.getElementById('cam-status').innerText=b.innerText+' 波偵測中';});});
canvas.addEventListener('click',e=>{if(!isPlaying) return; const r=canvas.getBoundingClientRect(); checkHit((e.clientX-r.left)/r.width*canvas.width, (e.clientY-r.top)/r.height*canvas.height);});
canvas.addEventListener('touchstart',e=>{if(!isPlaying) return; const r=canvas.getBoundingClientRect(); const t=e.touches[0]; checkHit((t.clientX-r.left)/r.width*canvas.width, (t.clientY-r.top)/r.height*canvas.height);},{passive:false});
resizeCanvas(); draw();
</script>
</body>
</html>
