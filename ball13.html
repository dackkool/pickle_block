<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>寶石方塊 - 方塊全螢幕版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#game-container{display:flex;width:100vw;height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)}
header{width:340px;display:flex;flex-direction:column;background:rgba(0,0,0,0.7);border-right:2px solid rgba(255,255,255,0.1);padding:10px;gap:8px;z-index:10}
#camera-box{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden;border:2px solid #00ff00;touch-action:none;flex-shrink:0}
#webcam-preview{width:100%;height:100%;display:block;transform:scaleX(-1)}
#roi-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.handle{position:absolute;width:30px;height:30px;background:#ffd700;border:3px solid #000;border-radius:50%;transform:translate(-50%,-50%);z-index:20;box-shadow:0 0 8px #ffd700}
.stat-row{display:flex;gap:6px}
.stat-box{flex:1;background:rgba(255,255,255,0.1);padding:5px;border-radius:8px;text-align:center;color:#fff;font-size:0.7rem}
.stat-box span{display:block;font-size:1.1rem;color:#ffd700;font-weight:bold}
.btn-small{width:100%;background:#222;color:#fff;border:1px solid #555;padding:6px;border-radius:8px;font-size:0.75rem}
#board-wrapper{flex:1;display:flex;justify-content:center;align-items:center;background:#0a0f1f}
canvas#gameCanvas{display:block;background:#111;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.8)}
#overlay{position:fixed;inset:0;background:rgba(10,10,20,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;z-index:99999;text-align:center;padding:20px}
.btn{background:linear-gradient(135deg,#ff416c,#ff4b2b);color:white;border:none;padding:16px 45px;font-size:1.3rem;font-weight:bold;border-radius:30px;cursor:pointer}
</style>
</head>
<body>
<video id="webcam" autoplay playsinline muted style="display:none"></video>
<div id="game-container">
<header>
<div id="camera-box">
<canvas id="webcam-preview"></canvas>
<svg id="roi-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon id="roi-poly" points="15,15 85,15 85,85 15,85" fill="rgba(255,215,0,0.2)" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4 3"/></svg>
<div class="handle" data-i="0"></div><div class="handle" data-i="1"></div><div class="handle" data-i="2"></div><div class="handle" data-i="3"></div>
</div>
<div class="stat-row">
<div class="stat-box">分數<span id="score">0</span></div>
<div class="stat-box">時間<span id="timer">02:00</span></div>
</div>
<button class="btn-small" id="reset-btn">↩️ 重置梯形</button>
<button class="btn-small" id="fs-btn">⛶ 全螢幕</button>
<div class="stat-box" id="cam-status" style="font-size:0.65rem;color:#aaa">後置鏡頭就緒，拖4黃點校正</div>
</header>
<div id="board-wrapper"><canvas id="gameCanvas"></canvas></div>
</div>
<div id="overlay">
<h1>寶石方塊 - 方塊版</h1>
<p style="margin:12px 0;color:#ccc">拖4黃點對齊電視 → 雙指可縮放<br>開始後自動全螢幕</p>
<button class="btn" id="start-btn">開啟後置鏡頭開始</button>
<p id="debug" style="color:#f66;margin-top:10px;font-size:11px"></p>
</div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),video=document.getElementById('webcam'),previewCanvas=document.getElementById('webcam-preview'),previewCtx=previewCanvas.getContext('2d');
const COLS=10,ROWS=7; let tileSize=48;
const GEM_COLORS=[{main:'#ff3366',dark:'#990022'},{main:'#33ccff',dark:'#006699'},{main:'#33ff66',dark:'#009922'},{main:'#ffcc00',dark:'#997a00'},{main:'#cc33ff',dark:'#660099'}];
let board=[],score=0,timeLeft=120,gameInterval=null,isPlaying=false,particles=[],ballX=-100,ballY=-100,lastHitTime=0;
let quad=[{x:0.15,y:0.15},{x:0.85,y:0.15},{x:0.85,y:0.85},{x:0.15,y:0.85}];
let homography=null;

function resizeCanvas(){
 const wrapper=document.getElementById('board-wrapper');
 const maxW=wrapper.clientWidth-20||800, maxH=wrapper.clientHeight-20||500;
 tileSize=Math.floor(Math.min(maxW/COLS,maxH/ROWS));
 canvas.width=COLS*tileSize; canvas.height=ROWS*tileSize;
 previewCanvas.width=320; previewCanvas.height=240;
 updateHandles();
}
window.addEventListener('resize',resizeCanvas);

async function setupCamera(){
 let s=null;
 try{ s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:640}}}); }
 catch(e){ s=await navigator.mediaDevices.getUserMedia({video:true}); }
 video.srcObject=s; await video.play(); requestAnimationFrame(trackLoop);
}
const procCanvas=document.createElement('canvas'),procCtx=procCanvas.getContext('2d',{willReadFrequently:true}); procCanvas.width=160; procCanvas.height=120;

function computeHomography(){
 const src=quad.map(p=>({x:p.x*procCanvas.width, y:p.y*procCanvas.height}));
 const dst=[{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:0,y:1}];
 let A=[],b=[]; for(let i=0;i<4;i++){const sx=src[i].x,sy=src[i].y,dx=dst[i].x,dy=dst[i].y;A.push([sx,sy,1,0,0,0,-dx*sx,-dx*sy]);b.push(dx);A.push([0,0,0,sx,sy,1,-dy*sx,-dy*sy]);b.push(dy);}
 let n=8; for(let i=0;i<n;i++){let m=i;for(let r=i;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];for(let r=i+1;r<n;r++){let f=A[r][i]/(A[i][i]||1);for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i];}}
 let h=new Array(8).fill(0);for(let i=7;i>=0;i--){let s=b[i];for(let c=i+1;c<8;c++)s-=A[i][c]*h[c];h[i]=s/(A[i][i]||1);} homography={h00:h[0],h01:h[1],h02:h[2],h10:h[3],h11:h[4],h12:h[5],h20:h[6],h21:h[7],h22:1};
}
function mapPoint(x,y){ if(!homography) return {u:x/160,v:y/120}; const h=homography; const d=h.h20*x+h.h21*y+h.h22; if(Math.abs(d)<1e-6) return null; return {u:(h.h00*x+h.h01*y+h.h02)/d, v:(h.h10*x+h.h11*y+h.h12)/d}; }

function trackLoop(){
 if(video.readyState>=2){
  previewCtx.save(); previewCtx.scale(-1,1); previewCtx.drawImage(video,-previewCanvas.width,0,previewCanvas.width,previewCanvas.height); previewCtx.restore();
  procCtx.drawImage(video,0,0,procCanvas.width,procCanvas.height);
  const d=procCtx.getImageData(0,0,procCanvas.width,procCanvas.height).data;
  let tx=0,ty=0,c=0; for(let i=0;i<d.length;i+=8){const r=d[i],g=d[i+1],b=d[i+2]; if(g>90&&r>80&&b<110&&(g-b)>30){const idx=i/4; tx+=idx%procCanvas.width; ty+=Math.floor(idx/procCanvas.width); c++;}}
  if(c>15){const m=mapPoint(tx/c,ty/c); if(m){ballX=(1-m.u)*canvas.width; ballY=m.v*canvas.height; if(isPlaying && Date.now()-lastHitTime>200){checkHit(ballX,ballY); lastHitTime=Date.now();}}} else ballX=-100;
 }
 requestAnimationFrame(trackLoop);
}
function checkHit(x,y){const c=Math.floor(x/tileSize), r=Math.floor(y/tileSize); if(r>=0&&r<ROWS&&c>=0&&c<COLS&&board[r][c]!==null) destroySingle(r,c);}
function updateHandles(){document.querySelectorAll('.handle').forEach((el,i)=>{el.style.left=quad[i].x*100+'%';el.style.top=quad[i].y*100+'%';});document.getElementById('roi-poly').setAttribute('points',quad.map(p=>`${p.x*100},${p.y*100}`).join(' '));computeHomography();}
