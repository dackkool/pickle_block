<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>寶石方塊 - 梯形校正版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#game-container{display:flex;width:100vw;height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)}
header{width:280px;display:flex;flex-direction:column;background:rgba(0,0,0,0.7);border-right:2px solid rgba(255,255,255,0.1);padding:10px;gap:8px;z-index:30;transition:transform.3s ease, width.3s ease}
header.expanded{width:92vw;max-width:520px;position:fixed;left:0;top:0;bottom:0;height:100vh;z-index:80;box-shadow:0 0 30px rgba(0,0,0,0.8)}
#camera-box{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden;border:2px solid #00ff00;touch-action:none;flex:1;min-height:180px}
header.expanded #camera-box{aspect-ratio:auto;height:75vh;min-height:320px}
#webcam-preview{width:100%;height:100%;display:block;transform:scaleX(-1)}
#roi-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.handle{position:absolute;width:32px;height:32px;background:#ffd700;border:3px solid #000;border-radius:50%;transform:translate(-50%,-50%);touch-action:none;z-index:20;box-shadow:0 0 8px #ffd700;cursor:grab}
.color-row{display:flex;gap:6px}
.color-btn{flex:1;padding:7px 2px;border-radius:8px;border:2px solid transparent;font-size:0.75rem;font-weight:bold;cursor:pointer;color:#fff}
.color-btn.active{border-color:#fff;transform:scale(1.05)}
#color-green{background:#22c55e} #color-red{background:#ef4444} #color-blue{background:#3b82f6} #color-yellow{background:#eab308;color:#000}
.stat-box{background:rgba(255,255,255,0.08);padding:6px;border-radius:8px;text-align:center;color:#fff;font-size:0.7rem}
.stat-box span{display:block;font-size:1.1rem;color:#ffd700}
.btn-small{width:100%;background:#222;color:#fff;border:1px solid #555;padding:7px;border-radius:8px;font-size:0.8rem}
#board-wrapper{flex:1;display:flex;justify-content:center;align-items:center;overflow:hidden;position:relative}
canvas#gameCanvas{display:block;background:#111;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.8)}
#hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:12px;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);padding:6px 18px;border-radius:20px;color:#fff;font-weight:bold;z-index:5;border:1px solid rgba(255,255,255,0.15)}
#hud b{color:#ffd700}
#overlay{position:fixed;inset:0;background:rgba(10,10,20,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;z-index:99999;text-align:center;padding:20px}
.btn{background:linear-gradient(135deg,#ff416c,#ff4b2b);color:white;border:none;padding:16px 45px;font-size:1.3rem;font-weight:bold;border-radius:30px;cursor:pointer}
</style>
</head>
<body>
<video id="webcam" autoplay playsinline muted style="display:none"></video>
<div id="game-container">
<header id="header">
<div id="camera-box">
<canvas id="webcam-preview"></canvas>
<svg id="roi-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon id="roi-poly" points="15,15 85,15 85,85 15,85" fill="rgba(255,215,0,0.18)" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4 3"/></svg>
<div class="handle" data-i="0"></div><div class="handle" data-i="1"></div><div class="handle" data-i="2"></div><div class="handle" data-i="3"></div>
</div>
<button class="btn-small" id="calib-btn">🔍 放大校正 (再按收回)</button>
<div class="color-row">
<button class="color-btn active" id="color-green" data-c="green">🟢 綠波</button>
<button class="color-btn" id="color-red" data-c="red">🔴 紅波</button>
<button class="color-btn" id="color-blue" data-c="blue">🔵 藍波</button>
<button class="color-btn" id="color-yellow" data-c="yellow">🟡 黃波</button>
</div>
<button class="btn-small" id="reset-btn">↩️ 重置梯形</button>
<div class="stat-box" id="cam-status" style="font-size:0.7rem;color:#aaa">揀波色 → 拖黃框對準牆上板</div>
<div class="stat-box" style="display:none">分數<span id="score">0</span></div>
<div class="stat-box" style="display:none">時間<span id="timer">02:00</span></div>
</header>
<div id="board-wrapper">
<div id="hud"><span>🏆 <b id="hud-score">0</b></span><span>⏱️ <b id="hud-timer">02:00</b></span></div>
<canvas id="gameCanvas"></canvas>
</div>
</div>
<div id="overlay">
<h1>寶石方塊 - 梯形校正版</h1>
<p>1. 揀你手上波嘅顏色<br>2. 按放大校正，拖4黃點套住牆上板<br>3. 橫放手機校正更準</p>
<button class="btn" id="start-btn">開啟後置鏡頭開始</button>
<p id="debug" style="color:#ff6666;margin-top:10px;font-size:12px"></p>
</div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),video=document.getElementById('webcam'),previewCanvas=document.getElementById('webcam-preview'),previewCtx=previewCanvas.getContext('2d');
const COLS=10,ROWS=7; let tileSize=40;
const GEM_COLORS=[
{main:'#ff6b81',light:'#ff99aa',dark:'#cc3355',emoji:'🐱'},
{main:'#70a1ff',light:'#a0c4ff',dark:'#3366cc',emoji:'🐶'},
{main:'#7bed9f',light:'#a8ffb5',dark:'#33aa55',emoji:'🐸'},
{main:'#ffa502',light:'#ffcc66',dark:'#cc8400',emoji:'🐯'},
{main:'#a55eea',light:'#c89cff',dark:'#7a33cc',emoji:'🐰'}
];
let board=[],score=0,timeLeft=120,gameInterval=null,isPlaying=false,particles=[],audioCtx=null,ballX=-100,ballY=-100,lastHitTime=0;
let quad=[{x:0.15,y:0.15},{x:0.85,y:0.15},{x:0.85,y:0.85},{x:0.15,y:0.85}];
let homography=null;
let selectedColor='green';

function initAudio(){if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume();}
function resizeCanvas(){const wrapper=document.getElementById('board-wrapper'); const maxW=wrapper.clientWidth-20,maxH=wrapper.clientHeight-20; tileSize=Math.floor(Math.min(maxW/COLS,maxH/ROWS)); canvas.width=COLS*tileSize; canvas.height=ROWS*tileSize; previewCanvas.width=320; previewCanvas.height=240; updateHandles();}
window.addEventListener('resize',resizeCanvas);

async function setupCamera(){
 let stream=null;
 try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:640},height:{ideal:480}}}); }
 catch(e){ try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}); } catch(e2){ stream=await navigator.mediaDevices.getUserMedia({video:true}); } }
 video.srcObject=stream; await video.play(); document.getElementById('cam-status').innerText='鏡頭已開啟 - 綠波偵測中'; requestAnimationFrame(trackLoop);
}
const procCanvas=document.createElement('canvas'),procCtx=procCanvas.getContext('2d',{willReadFrequently:true}); procCanvas.width=160; procCanvas.height=120;

function computeHomography(){
 const src=quad.map(p=>({x:p.x*procCanvas.width, y:p.y*procCanvas.height}));
 const dst=[{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:0,y:1}];
 let A=[],b=[]; for(let i=0;i<4;i++){ const sx=src[i].x,sy=src[i].y,dx=dst[i].x,dy=dst[i].y; A.push([sx,sy,1,0,0,0,-dx*sx,-dx*sy]); b.push(dx); A.push([0,0,0,sx,sy,1,-dy*sx,-dy*sy]); b.push(dy); }
 let n=8; for(let i=0;i<n;i++){ let max=i; for(let r=i;r<n;r++) if(Math.abs(A[r][i])>Math.abs(A[max][i])) max=r; [A[i],A[max]]=[A[max],A[i]]; [b[i],b[max]]=[b[max],b[i]]; if(Math.abs(A[i][i])<1e-8) continue; for(let r=i+1;r<n;r++){ let f=A[r][i]/A[i][i]; for(let c=i;c<n;c++) A[r][c]-=f*A[i][c]; b[r]-=f*b[i]; } }
 let h=new Array(n).fill(0); for(let i=n-1;i>=0;i--){ let s=b[i]; for(let c=i+1;c<n;c++) s-=A[i][c]*h[c]; h[i]=s/(A[i][i]||1); }
 homography={h00:h[0],h01:h[1],h02:h[2],h10:h[3],h11:h[4],h12:h[5],h20:h[6],h21:h[7],h22:1};
}
function mapPoint(x,y){ if(!homography) return null; const h=homography; const d=h.h20*x+h.h21*y+h.h22; if(Math.abs(d)<1e-6) return null; return {u:(h.h00*x+h.h01*y+h.h02)/d, v:(h.h10*x+h.h11*y+h.h12)/d}; }

function isBallColor(r,g,b){
 if(selectedColor==='green') return g>85 && r>50 && b<130 && (g-b)>15;
 if(selectedColor==='red') return r>140 && g<110 && b<110 && (r-g)>30;
 if(selectedColor==='blue') return b>110 && r<110 && g<160 && (b-r)>10;
 if(selectedColor==='yellow') return r>150 && g>130 && b<120 && r>80;
 return false;
}

function trackLoop(){
 if(video.readyState>=2){
  previewCtx.save(); previewCtx.scale(-1,1); previewCtx.drawImage(video, -previewCanvas.width, 0, previewCanvas.width, previewCanvas.height); previewCtx.restore();
  procCtx.drawImage(video,0,0,procCanvas.width,procCanvas.height);
  const data=procCtx.getImageData(0,0,procCanvas.width,procCanvas.height).data;
  let tx=0,ty=0,cnt=0;
  for(let y=0;y<procCanvas.height;y+=2){ for(let x=0;x<procCanvas.width;x+=2){ const i=(y*procCanvas.width+x)*4; const r=data[i],g=data[i+1],b=data[i+2]; if(isBallColor(r,g,b)){ tx+=x; ty+=y; cnt++; } } }
  if(cnt>12){
   const avgX=tx/cnt, avgY=ty/cnt;
   // 紅點提示已偵測到
   previewCtx.fillStyle=cnt>20?'#00ff00':'#ffaa00';
   previewCtx.beginPath(); previewCtx.arc((1-avgX/procCanvas.width)*previewCanvas.width, avgY/procCanvas.height*previewCanvas.height, 8,0,Math.PI*2); previewCtx.fill();
   const m=mapPoint(avgX,avgY);
   if(m && m.u>=0 && m.u<=1 && m.v>=0 && m.v<=1){
    ballX=(1-m.u)*canvas.width; ballY=m.v*canvas.height;
    if(isPlaying && Date.now()-lastHitTime>250){ checkHit(ballX,ballY); lastHitTime=Date.now(); }
   }
  } else { ballX=-100; ballY=-100; }
 }
 requestAnimationFrame(trackLoop);
}
function checkHit(x,y){ const c=Math.floor(x/tileSize), r=Math.floor(y/tileSize); if(r>=0&&r<ROWS&&c>=0&&c<COLS&&board[r][c]!==null){ destroySingle(r,c); } }
function updateHandles(){
 document.querySelectorAll('.handle').forEach((el,i)=>{ el.style.left=(quad[i].x*100)+'%'; el.style.top=(quad[i].y*100)+'%'; });
 document.getElementById('roi-poly').setAttribute('points', quad.map(p=>`${p.x*100},${p.y*100}`).join(' '));
 computeHomography();
}
(function enableDrag(){
 const box=document.getElementById('camera-box'); let active=-1;
 document.querySelectorAll('.handle').forEach(h=>{
  h.addEventListener('pointerdown',e=>{ active=parseInt(h.dataset.i); h.setPointerCapture(e.pointerId); e.preventDefault(); });
 });
 window.addEventListener('pointermove',e=>{
  if(active>=0){ const rect=box.getBoundingClientRect(); const x=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width)); const y=Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height)); quad[active]={x,y}; updateHandles(); }
 });
 window.addEventListener('pointerup',()=>active=-1);
 let lastDist=0, startQuad=null;
 box.addEventListener('touchstart',e=>{
  if(e.touches.length===2){ const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY; lastDist=Math.hypot(dx,dy); startQuad=quad.map(p=>({...p})); }
 },{passive:false});
 box.addEventListener('touchmove',e=>{
  if(e.touches.length===2 && startQuad){
   e.preventDefault();
   const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY; const dist=Math.hypot(dx,dy); const scale=dist/(lastDist||dist);
   const cx=0.5, cy=0.5; quad=startQuad.map(p=>({x:Math.max(0,Math.min(1,cx+(p.x-cx)*scale)), y:Math.max(0,Math.min(1,cy+(p.y-cy)*scale))})); updateHandles();
  }
 },{passive:false});
 box.addEventListener('touchend',()=>{ startQuad=null; });
})();

async function startGame(){
 const btn=document.getElementById('start-btn'); btn.innerText='啟動中...'; btn.disabled=true;
 try{
  document.getElementById('overlay').style.display='none';
  await setupCamera();
 }catch(err){
  document.getElementById('debug').innerText='鏡頭失敗: '+err.message;
  document.getElementById('overlay').style.display='flex'; btn.innerText='再試後置鏡頭'; btn.disabled=false; return;
 }
 initAudio(); score=0; timeLeft=120;
 document.getElementById('score').innerText=0; document.getElementById('hud-score').innerText=0;
 initBoard(); isPlaying=true;
 document.getElementById('header').classList.remove('expanded');
 if(gameInterval) clearInterval(gameInterval);
 gameInterval=setInterval(()=>{
  timeLeft--; const m=Math.floor(timeLeft/60),s=timeLeft
