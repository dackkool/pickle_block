<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>寶石方塊連消 - 橫向版</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #game-container {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        }
        header {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 180px;
            padding: 20px 10px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            gap: 20px;
            border-right: 2px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 15px;
            text-align: center;
            width: 100%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
            font-size: 1.1rem;
            font-weight: bold;
        }
        .stat-box span {
            display: block;
            font-size: 1.4rem;
            color: #ffd700;
            margin-top: 5px;
        }
        #board-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
            height: 100%;
        }
        canvas {
            display: block;
            touch-action: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 12px;
        }
        /* 結算 / 開始 覆蓋層 */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 99999;
            text-align: center;
            padding: 20px;
            cursor: pointer;
        }
        #overlay h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        #overlay p {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: #ddd;
            max-width: 600px;
            pointer-events: none;
        }
        .btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.5);
            transition: transform 0.1s, box-shadow 0.1s;
            -webkit-tap-highlight-color: transparent;
            pointer-events: auto;
        }
        .btn:active {
            transform: scale(0.95);
        }

        /* 手機直向時自動適應 */
        @media (max-aspect-ratio: 1/1) {
            #game-container {
                flex-direction: column;
            }
            header {
                width: 100%;
                flex-direction: row;
                height: 70px;
                padding: 5px 15px;
                border-right: none;
                border-bottom: 2px solid rgba(255, 255, 255, 0.1);
                gap: 10px;
            }
            .stat-box {
                font-size: 0.9rem;
                padding: 5px 10px;
            }
            .stat-box span {
                font-size: 1.1rem;
                display: inline;
                margin-left: 5px;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <div class="stat-box">分數<span id="score">0</span></div>
        <div class="stat-box">剩餘時間<span id="timer">02:00</span></div>
    </header>
    <div id="board-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>
</div>

<div id="overlay">
    <h1 id="overlay-title">寶石方塊連消</h1>
    <p id="overlay-desc">建議將手機橫放獲得最佳體驗！點擊任意寶石可消除相連同色群組，上方方塊會自動落下補滿。限時 2 分鐘爭取最高分！</p>
    <button class="btn" id="start-btn">開始遊戲</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const COLS = 11;
    const ROWS = 8;
    let tileSize = 45;

    const GEM_COLORS = [
        { main: '#ff3366', light: '#ff8099', dark: '#cc0033', shape: 'diamond' }, // 紅
        { main: '#33ccff', light: '#80e5ff', dark: '#0099cc', shape: 'circle' },  // 藍
        { main: '#33ff66', light: '#80ff99', dark: '#00cc33', shape: 'square' },  // 綠
        { main: '#ffcc00', light: '#ffe680', dark: '#cc9900', shape: 'star' },    // 黃
        { main: '#cc33ff', light: '#e680ff', dark: '#9900cc', shape: 'triangle' }// 紫
    ];

    let board = [];
    let score = 0;
    let timeLeft = 120;
    let gameInterval = null;
    let isPlaying = false;
    let particles = [];
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } else if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'match') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(600, now + 0.1);
                osc.frequency.setValueAtTime(900, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.5);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        } catch(e) {}
    }

    function resizeCanvas() {
        const wrapper = document.getElementById('board-wrapper');
        const maxWidth = wrapper.clientWidth - 20;
        const maxHeight = wrapper.clientHeight - 20;
        
        tileSize = Math.floor(Math.min(maxWidth / COLS, maxHeight / ROWS));
        canvas.width = COLS * tileSize;
        canvas.height = ROWS * tileSize;
    }
    window.addEventListener('resize', resizeCanvas);

    function startGame(e) {
        if (e) {
            e.stopPropagation();
            e.preventDefault();
        }
        
        initAudio();
        
        const overlay = document.getElementById('overlay');
        overlay.style.display = 'none';
        overlay.style.pointerEvents = 'none';
        
        score = 0;
        timeLeft = 120;
        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = '02:00';
        
        initBoard();
        isPlaying = true;
        
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(() => {
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    // 綁定開始按鈕（同時監聽 click, touchend, pointerdown 確保萬無一失）
    const startBtn = document.getElementById('start-btn');
    const overlay = document.getElementById('overlay');

    ['click', 'touchend', 'pointerdown'].forEach(evt => {
        startBtn.addEventListener(evt, startGame, { passive: false });
        overlay.addEventListener(evt, (e) => {
        if (e.target === overlay) startGame(e);
    }, { passive: false });
    });

    function endGame() {
        isPlaying = false;
        clearInterval(gameInterval);
        playSound('gameover');
        
        const overlay = document.getElementById('overlay');
        document.getElementById('overlay-title').innerText = '時間到！遊戲結束';
        document.getElementById('overlay-desc').innerText = `最終得分：${score} 分`;
        document.getElementById('start-btn').innerText = '重新開始';
        overlay.style.display = 'flex';
        overlay.style.pointerEvents = 'auto';
    }

    function initBoard() {
        resizeCanvas();
        board = [];
        for (let r = 0; r < ROWS; r++) {
            board[r] = [];
            for (let c = 0; c < COLS; c++) {
                board[r][c] = Math.floor(Math.random() * GEM_COLORS.length);
            }
        }
        resolveMatchesInstant();
    }

    function resolveMatchesInstant() {
        let matched;
        do {
            matched = findMatches();
            if (matched.length > 0) {
                matched.forEach(pos => {
                    board[pos.r][pos.c] = Math.floor(Math.random() * GEM_COLORS.length);
                });
            }
        } while (matched.length > 0);
    }

    function findMatches() {
        let visited = Array(ROWS).fill(0).map(() => Array(COLS).fill(false));
        let allMatches = [];

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (board[r][c] !== null && !visited[r][c]) {
                    let group = getConnectedGroup(r, c, board[r][c], visited);
                    if (group.length >= 4) {
                        allMatches.push(...group);
                    }
                }
            }
        }
        return allMatches;
    }

    function getConnectedGroup(r, c, color, visited) {
        let group = [];
        let stack = [{r, c}];
        while (stack.length > 0) {
            let curr = stack.pop();
            let cr = curr.r;
            let cc = curr.c;
            
            if (cr < 0 || cr >= ROWS || cc < 0 || cc >= COLS) continue;
            if (visited[cr][cc]) continue;
            if (board[cr][cc] !== color) continue;
            
            visited[cr][cc] = true;
            group.push({r: cr, c: cc});
            
            stack.push({r: cr + 1, c: cc});
            stack.push({r: cr - 1, c: cc});
            stack.push({r: cr, c: cc + 1});
            stack.push({r: cr, c: cc - 1});
        }
        return group;
    }

    canvas.addEventListener('click', (e) => {
        if (!isPlaying) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const c = Math.floor(x / tileSize);
        const r = Math.floor(y / tileSize);
        
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] !== null) {
            clickedGem(r, c);
        }
    });

    canvas.addEventListener('touchend', (e) => {
        if (!isPlaying) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const touch = e.changedTouches[0];
        const x = touch.clientX - rect.left;
        const y = touch.clientY - rect.top;
        
        const c = Math.floor(x / tileSize);
        const r = Math.floor(y / tileSize);
        
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] !== null) {
            clickedGem(r, c);
        }
    }, {passive: false});

    function clickedGem(r, c) {
        let color = board[r][c];
        let visited = Array(ROWS).fill(0).map(() => Array(COLS).fill(false));
        let group = getConnectedGroup(r, c, color, visited);
        
        if (group.length > 0) {
            destroyGroup(group);
        }
    }

    function destroyGroup(group) {
        score += group.length * 10;
        document.getElementById('score').innerText = score;
        playSound('pop');

        group.forEach(pos => {
            createParticles(pos.c * tileSize + tileSize / 2, pos.r * tileSize + tileSize / 2, GEM_COLORS[board[pos.r][pos.c]].main);
            board[pos.r][pos.c] = null;
        });

        applyGravityAndRefill();
    }

    function checkAndProcessAutomaticMatches() {
        let matches = findMatches();
        if (matches.length > 0) {
            score += matches.length * 15;
            document.getElementById('score').innerText = score;
            playSound('match');

            matches.forEach(pos => {
                if (board[pos.r][pos.c] !== null) {
                    createParticles(pos.c * tileSize + tileSize / 2, pos.r * tileSize + tileSize / 2, GEM_COLORS
