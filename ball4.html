<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>寶石方塊 - 投球互動版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #game-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        }
        header {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 150px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            gap: 15px;
            border-right: 2px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            flex-shrink: 0;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 10px;
            text-align: center;
            width: 100%;
            font-size: 0.95rem;
            font-weight: bold;
        }
        .stat-box span {
            display: block;
            font-size: 1.2rem;
            color: #ffd700;
            margin-top: 4px;
        }
        #board-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        canvas {
            display: block;
            touch-action: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
            background: #111;
        }
        /* 左下角攝影機預覽畫面 */
        #webcam-preview {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 160px;
            height: 120px;
            border-radius: 8px;
            border: 2px solid #00ff00;
            transform: scaleX(-1); /* 鏡像翻轉 */
            z-index: 50;
            background: #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        /* 開始與結算覆蓋層 */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 10, 20, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 99999;
            text-align: center;
            padding: 20px;
            cursor: pointer;
        }
        #overlay h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }
        #overlay p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #cbd5e1;
            max-width: 500px;
            line-height: 1.5;
            pointer-events: none;
        }
        .btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 65, 108, 0.5);
            -webkit-tap-highlight-color: transparent;
            pointer-events: auto;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<video id="webcam" autoplay playsinline muted style="display:none;"></video>

<div id="game-container">
    <header>
        <div class="stat-box">分數<span id="score">0</span></div>
        <div class="stat-box">時間<span id="timer">02:00</span></div>
    </header>
    <div id="board-wrapper">
        <canvas id="gameCanvas"></canvas>
        <canvas id="webcam-preview"></canvas>
    </div>
</div>

<div id="overlay">
    <h1 id="overlay-title">寶石方塊 - 投球互動版</h1>
    <p id="overlay-desc">請將手機前置鏡頭對著自己。點擊下方按鈕允許相機後，左下角會顯示鏡頭預覽，拿起球體在鏡頭前移動即可消除寶石！</p>
    <button class="btn" id="start-btn">允許相機並開始遊戲</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('webcam');
    const previewCanvas = document.getElementById('webcam-preview');
    const previewCtx = previewCanvas.getContext('2d');
    
    const COLS = 10;
    const ROWS = 7;
    let tileSize = 40;

    const GEM_COLORS = [
        { main: '#ff3366', light: '#ff8099', dark: '#cc0033', shape: 'diamond' },
        { main: '#33ccff', light: '#80e5ff', dark: '#0099cc', shape: 'circle' },
        { main: '#33ff66', light: '#80ff99', dark: '#00cc33', shape: 'square' },
        { main: '#ffcc00', light: '#ffe680', dark: '#cc9900', shape: 'star' },
        { main: '#cc33ff', light: '#e680ff', dark: '#9900cc', shape: 'triangle' }
    ];

    let board = [];
    let score = 0;
    let timeLeft = 120;
    let gameInterval = null;
    let isPlaying = false;
    let particles = [];
    let audioCtx = null;

    let ballX = -100;
    let ballY = -100;
    let lastHitTime = 0;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } else if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'match') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(600, now + 0.1);
                osc.frequency.setValueAtTime(900, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.5);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        } catch(e) {}
    }

    function resizeCanvas() {
        const wrapper = document.getElementById('board-wrapper');
        const maxWidth = wrapper.clientWidth - 20;
        const maxHeight = wrapper.clientHeight - 20;
        
        tileSize = Math.floor(Math.min(maxWidth / COLS, maxHeight / ROWS));
        canvas.width = COLS * tileSize;
        canvas.height = ROWS * tileSize;
        
        previewCanvas.width = 160;
        previewCanvas.height = 120;
