<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>寶石方塊 - 梯形校正版 - Fixed</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#game-container{display:flex;width:100vw;height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)}
header{width:240px;display:flex;flex-direction:column;background:rgba(0,0,0,0.7);border-right:2px solid rgba(255,255,255,0.1);padding:12px;gap:10px;z-index:10}
#camera-box{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden;border:2px solid #00ff00;touch-action:none}
#webcam-preview{width:100%;height:100%;display:block;transform:scaleX(-1)}
#roi-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.handle{position:absolute;width:24px;height:24px;background:#ffd700;border:2px solid #000;border-radius:50%;transform:translate(-50%,-50%);touch-action:none;z-index:20;box-shadow:0 0 6px #ffd700}
.stat-box{background:rgba(255,255,255,0.1);padding:8px;border-radius:10px;text-align:center;color:#fff;font-weight:bold}
.stat-box span{display:block;font-size:1.3rem;color:#ffd700}
.btn-small{width:100%;background:#222;color:#fff;border:1px solid #555;padding:8px;border-radius:8px;font-size:0.85rem}
#board-wrapper{flex:1;display:flex;justify-content:center;align-items:center;overflow:hidden}
canvas#gameCanvas{display:block;background:#111;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.8)}
#overlay{position:fixed;inset:0;background:rgba(10,10,20,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;z-index:99999;text-align:center;padding:20px}
#debug{font-size:0.8rem;color:#ff7777;margin-top:12px;white-space:pre-wrap}
.btn{background:linear-gradient(135deg,#ff416c,#ff4b2b);color:white;border:none;padding:16px 45px;font-size:1.3rem;font-weight:bold;border-radius:30px;cursor:pointer}
</style>
</head>
<body>
<video id="webcam" autoplay playsinline muted style="display:none"></video>
<div id="game-container">
<header>
<div id="camera-box">
<canvas id="webcam-preview"></canvas>
<svg id="roi-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon id="roi-poly" points="15,15 85,15 85,85 15,85" fill="rgba(255,215,0,0.18)" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4 3"/></svg>
<div class="handle" data-i="0"></div><div class="handle" data-i="1"></div><div class="handle" data-i="2"></div><div class="handle" data-i="3"></div>
</div>
<button class="btn-small" id="reset-btn">重置梯形</button>
<button class="btn-small">💡 拖4角對齊 → 雙指縮放</button>
<div class="stat-box">分數<span id="score">0</span></div>
<div class="stat-box">時間<span id="timer">02:00</span></div>
<div class="stat-box" id="cam-status" style="font-size:0.75rem;color:#0f0">鏡頭: 未啟動</div>
</header>
<div id="board-wrapper"><canvas id="gameCanvas"></canvas></div>
</div>
<div id="overlay">
<h1>寶石方塊 - 梯形校正版</h1>
<p>用後置鏡頭對住電視<br>拖動4個黃點套住遊戲板</p>
<button class="btn" id="start-btn">開啟後置鏡頭</button>
<div id="debug"></div>
</div>
