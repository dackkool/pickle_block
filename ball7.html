<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>寶石方塊 - 投球互動版</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;user-select:none}
        html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
        #game-container{display:flex;width:100vw;height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)}
        header{display:flex;flex-direction:column;justify-content:center;align-items:center;width:150px;padding:10px;background:rgba(0,0,0,0.5);color:#fff;gap:15px;border-right:2px solid rgba(255,255,255,0.1);z-index:10;flex-shrink:0}
       .stat-box{background:rgba(255,255,255,0.1);padding:8px;border-radius:10px;text-align:center;width:100%;font-size:0.95rem;font-weight:bold}
       .stat-box span{display:block;font-size:1.2rem;color:#ffd700;margin-top:4px}
        #board-wrapper{flex:1;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden}
        canvas{display:block;touch-action:none;box-shadow:0 10px 30px rgba(0,0,0,0.8);border-radius:8px;background:#111}
        #webcam-preview{position:absolute;bottom:10px;left:10px;width:160px;height:120px;border-radius:8px;border:2px solid #00ff00;transform:scaleX(-1);z-index:50;background:#000}
        #overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(10,10,20,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;z-index:99999;text-align:center;padding:20px}
        #overlay h1{font-size:2.2rem;margin-bottom:10px;color:#ffd700}
        #overlay p{font-size:1.1rem;margin-bottom:25px;color:#cbd5e1;max-width:500px;line-height:1.5}
       .btn{background:linear-gradient(135deg,#ff416c,#ff4b2b);color:white;border:none;padding:16px 45px;font-size:1.3rem;font-weight:bold;border-radius:30px;cursor:pointer;box-shadow:0 5px 20px rgba(255,65,108,0.5)}
       .btn:active{transform:scale(0.95)}
    </style>
</head>
<body>
<video id="webcam" autoplay playsinline muted style="display:none;"></video>
<div id="game-container">
    <header>
        <div class="stat-box">分數<span id="score">0</span></div>
        <div class="stat-box">時間<span id="timer">02:00</span></div>
    </header>
    <div id="board-wrapper">
        <canvas id="gameCanvas"></canvas>
        <canvas id="webcam-preview"></canvas>
    </div>
</div>
<div id="overlay">
    <h1 id="overlay-title">寶石方塊 - 投球互動版</h1>
    <p id="overlay-desc">請將手機前置鏡頭對著自己。點擊下方按鈕允許相機後，左下角會顯示鏡頭預覽，拿起綠色球體在鏡頭前移動即可消除寶石！</p>
    <button class="btn" id="start-btn">允許相機並開始遊戲</button>
</div>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('webcam');
    const previewCanvas = document.getElementById('webcam-preview');
    const previewCtx = previewCanvas.getContext('2d');
    const COLS = 10, ROWS = 7;
    let tileSize = 40;
    const GEM_COLORS = [
        { main: '#ff3366', light: '#ff8099', dark: '#cc0033', shape: 'diamond' },
        { main: '#33ccff', light: '#80e5ff', dark: '#0099cc', shape: 'circle' },
        { main: '#33ff66', light: '#80ff99', dark: '#00cc33', shape: 'square' },
        { main: '#ffcc00', light: '#ffe680', dark: '#cc9900', shape: 'star' },
        { main: '#cc33ff', light: '#e680ff', dark: '#9900cc', shape: 'triangle' }
    ];
    let board = [], score = 0, timeLeft = 120, gameInterval = null, isPlaying = false, particles = [], audioCtx = null;
    let ballX = -100, ballY = -100, lastHitTime = 0;

    function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }
    function playSound(type){ if(!audioCtx) return; try{ const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); const now=audioCtx.currentTime; if(type==='pop'){ osc.type='sine'; osc.frequency.setValueAtTime(400,now); osc.frequency.exponentialRampToValueAtTime(800,now+0.15); gain.gain.setValueAtTime(0.3,now); gain.gain.linearRampToValueAtTime(0.01,now+0.15); osc.start(now); osc.stop(now+0.15);} else if(type==='match'){ osc.type='triangle'; osc.frequency.setValueAtTime(300,now); osc.frequency.setValueAtTime(600,now+0.1); gain.gain.setValueAtTime(0.3,now); gain.gain.linearRampToValueAtTime(0.01,now+0.3); osc.start(now); osc.stop(now+0.3);} }catch(e){} }
    function resizeCanvas(){ const wrapper=document.getElementById('board-wrapper'); const maxWidth=wrapper.clientWidth-20; const maxHeight=wrapper.clientHeight-20; tileSize=Math.floor(Math.min(maxWidth/COLS,maxHeight/ROWS)); canvas.width=COLS*tileSize; canvas.height=ROWS*tileSize; previewCanvas.width=160; previewCanvas.height=120; }
    window.addEventListener('resize', resizeCanvas);

    async function setupCamera(){
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 320, height: 240 } });
        video.srcObject = stream;
        await video.play();
        requestAnimationFrame(trackBallLoop);
    }
    const procCanvas=document.createElement('canvas'); const procCtx=procCanvas.getContext('2d',{willReadFrequently:true}); procCanvas.width=160; procCanvas.height=120;
    function trackBallLoop(){
        if(video.readyState===video.HAVE_ENOUGH_DATA){
            previewCtx.clearRect(0,0,previewCanvas.width,previewCanvas.height);
            previewCtx.drawImage(video,0,0,previewCanvas.width,previewCanvas.height);
            procCtx.drawImage(video,0,0,procCanvas.width,procCanvas.height);
            const data=procCtx.getImageData(0,0,procCanvas.width,procCanvas.height).data;
            let totalX=0,totalY=0,count=0;
            for(let i=0;i<data.length;i+=4){ const r=data[i],g=data[i+1],b=data[i+2]; if(g>100&&r>90&&b<100&&(g-b)>40){ const idx=i/4; totalX+=idx%procCanvas.width; totalY+=Math.floor(idx/procCanvas.width); count++; } }
            if(count>15){
                const avgX=totalX/count, avgY=totalY/count;
                ballX = (1-(avgX/procCanvas.width))*canvas.width;
                ballY = (avgY/procCanvas.height)*canvas.height;
                previewCtx.fillStyle='#00ff00'; previewCtx.beginPath(); previewCtx.arc(avgX,avgY,6,0,Math.PI*2); previewCtx.fill();
                if(isPlaying && Date.now()-lastHitTime>300){ checkBallHit(ballX,ballY); lastHitTime=Date.now(); }
            } else { ballX=-100; ballY=-100; }
        }
        requestAnimationFrame(trackBallLoop);
    }
    function checkBallHit(x,y){ const c=Math.floor(x/tileSize), r=Math.floor(y/tileSize); if(r>=0&&r<ROWS&&c>=0&&c<COLS&&board[r]&&board[r][c]!==null){ let visited=Array(ROWS).fill(0).map(()=>Array(COLS).fill(false)); let group=getConnectedGroup(r,c,board[r][c],visited); if(group.length>1) destroyGroup(group); } }
    async function startGame(){
        document.getElementById('overlay').style.display='none';
        try{ await setupCamera(); }catch(err){ alert('相機授權失敗：'+err.message+'\n請用https或者localhost打開'); document.getElementById('overlay').style.display='flex'; return; }
        initAudio(); score=0; timeLeft=120; document.getElementById('score').innerText=score; document.getElementById('timer').innerText='02:00'; initBoard(); isPlaying=true;
        if(gameInterval) clearInterval(gameInterval);
        gameInterval=setInterval(()=>{ timeLeft--; let m=Math.floor(timeLeft/60), s=timeLeft%60; document.getElementById('timer').innerText=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; if(timeLeft<=0) endGame(); },1000);
        requestAnimationFrame(gameLoop);
    }
    function endGame(){ isPlaying=false; clearInterval(gameInterval); const overlay=document.getElementById('overlay'); document.getElementById('overlay-title').innerText='時間到！'; document.getElementById('overlay-desc').innerText=`最終得分：${score} 分`; document.getElementById('start-btn').innerText='重新開始'; overlay.style.display='flex'; }
    function initBoard(){ resizeCanvas(); board=[]; for(let r=0;r<ROWS;r++){ board[r]=[]; for(let c=0;c<COLS;c++) board[r][c]=Math.floor(Math.random()*GEM_COLORS.length); } resolveMatchesInstant(); }
    function resolveMatchesInstant(){ let m; do{ m=findMatches(); m.forEach(p=>board[p.r][p.c]=Math.floor(Math.random()*GEM_COLORS.length)); }while(m.length>0); }
    function findMatches(){ let visited=Array(ROWS).fill(0).map(()=>Array(COLS).fill(false)); let all=[]; for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(board[r][c]!==null&&!visited[r][c]){ let g=getConnectedGroup(r,c,board[r][c],visited); if(g.length>=4) all.push(...g); } return all; }
    function getConnectedGroup(r,c,color,visited){ let group=[],stack=[{r,c}]; while(stack.length){ let cur=stack.pop(); let cr=cur.r,cc=cur.c; if(cr<0||cr>=ROWS||cc<0||cc>=COLS) continue; if(visited[cr][cc]) continue; if(board[cr][cc]!==color) continue; visited[cr][cc]=true; group.push({r:cr,c:cc}); stack.push({r:cr+1,c:cc},{r:cr-1,c:cc},{r:cr,c:cc+1},{r:cr,c:cc-1}); } return group; }
    canvas.addEventListener('click', e=>{ const rect=canvas.getBoundingClientRect(); const x=(e.clientX-rect.left)/rect.width*canvas.width; const y=(e.clientY-rect.top)/rect.height*canvas.height; checkBallHit(x,y); });
    function destroyGroup(group){ score+=group.length*10; document.getElementById('score').innerText=score; playSound('pop'); group.forEach(pos=>{ createParticles(pos.c*tileSize+tileSize/2,pos.r*tileSize+tileSize/2,GEM_COLORS[board[pos.r][pos.c]].main); board[pos.r][pos.c]=null; }); applyGravityAndRefill(); }
    function checkAndProcessAutomaticMatches(){ let matches=findMatches(); if(matches.length>0){ score+=matches.length*15; document.getElementById('score').innerText=score; playSound('match'); matches.forEach(pos=>{ if(board[pos.r][pos.c]!==null){ createParticles(pos.c*tileSize+tileSize/2,pos.r*tileSize+tileSize/2,GEM_COLORS[board[pos.r][pos.c]].main); board[pos.r][pos.c]=null; } }); applyGravityAndRefill(); } }
    function applyGravityAndRefill(){ for(let c=0;c<COLS;c++){ let w=ROWS-1; for(let r=ROWS-1;r>=0;r--) if(board[r][c]!==null){ let t=board[r][c]; board[r][c]=null; board[w][c]=t; w--; } for(let r=w;r>=0;r--) board[r][c]=Math.floor(Math.random()*GEM_COLORS.length); } setTimeout(()=>{ if(isPlaying) checkAndProcessAutomaticMatches(); },200); }
    function createParticles(x,y,color){ for(let i=0;i<12;i++){ const a=Math.random()*Math.PI*2,s=Math.random()*4+2; particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,alpha:1,decay:Math.random()*0.03+0.02}); } }
    function drawGem(x,y,size,colorObj){ ctx.save(); ctx.translate(x,y); const s=size*0.82,half=s/2; ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=6; ctx.shadowOffsetY=3; const grad=ctx.createRadialGradient(-s*0.2,-s*0.2,s*0.1,0,0,s); grad.addColorStop(0,colorObj.light); grad.addColorStop(1,colorObj.dark); ctx.fillStyle=grad; if(colorObj.shape==='diamond'){ ctx.beginPath(); ctx.moveTo(0,-half); ctx.lineTo(half,0); ctx.lineTo(0,half); ctx.lineTo(-half,0); ctx.fill(); } else if(colorObj.shape==='circle'){ ctx.beginPath(); ctx.arc(0,0,half*0.85,0,Math.PI*2); ctx.fill(); } else if(colorObj.shape==='square'){ ctx.beginPath(); ctx.roundRect(-half*0.8,-half*0.8,s*0.8,s*0.8,6); ctx.fill(); } else { ctx.beginPath(); ctx.arc(0,0,half*0.8,0,Math.PI*2); ctx.fill(); } ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(-half*0.3,-half*0.3,half*0.25,0,Math.PI*2); ctx.fill(); ctx.restore(); }
    function update(){ for(let i=particles.length-1;i>=0;i--){ let p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.alpha-=p.decay; if(p.alpha<=0) particles.splice(i,1); } }
    function draw(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ ctx.fillStyle=(r+c)%2===0?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.1)'; ctx.fillRect(c*tileSize,r*tileSize,tileSize,tileSize); if(board[r]&&board[r][c]!==null) drawGem(c*tileSize+tileSize/2,r*tileSize+tileSize/2,tileSize,GEM_COLORS[board[r][c]]); }
        for(let p of particles){ ctx.globalAlpha=p.alpha; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1;
        if(ballX>0){ ctx.save(); ctx.strokeStyle='#00ff00'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(ballX,ballY,18,0,Math.PI*2); ctx.stroke(); ctx.fillStyle='rgba(0,255,0,0.3)'; ctx.fill(); ctx.restore(); }
    }
    function gameLoop(){ update(); draw(); if(isPlaying) requestAnimationFrame(gameLoop); }
    // 綁定按鈕，唔用inline onclick更穩
    document.getElementById('start-btn').addEventListener('click', startGame);
    resizeCanvas();
</script>
</body>
</html>
