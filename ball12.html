<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>寶石方塊 - 方塊版全螢幕</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#game-container{display:flex;width:100vw;height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)}
/* 左邊加闊，preview更大 */
header{width:360px;display:flex;flex-direction:column;background:rgba(0,0,0,0.65);border-right:2px solid rgba(255,255,255,0.1);padding:10px;gap:8px;z-index:10}
#camera-box{position:relative;width:100%;flex:1;min-height:260px;background:#000;border-radius:12px;overflow:hidden;border:2px solid #00ff00;touch-action:none}
#webcam-preview{width:100%;height:100%;display:block;transform:scaleX(-1);object-fit:cover}
#roi-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.handle{position:absolute;width:28px;height:28px;background:#ffd700;border:3px solid #000;border-radius:50%;transform:translate(-50%,-50%);touch-action:none;z-index:20;box-shadow:0 0 8px #ffd700;cursor:grab}
.handle:active{transform:translate(-50%,-50%) scale(1.3)}
/* 分數時間縮小 */
.stat-row{display:flex;gap:6px}
.stat-box{flex:1;background:rgba(255,255,255,0.08);padding:4px 6px;border-radius:8px;text-align:center;color:#ccc;font-size:0.7rem;line-height:1.1}
.stat-box span{display:block;font-size:1.1rem;color:#ffd700;font-weight:bold}
.btn-small{width:100%;background:#222;color:#fff;border:1px solid #555;padding:6px;border-radius:8px;font-size:0.75rem}
#board-wrapper{flex:1;display:flex;justify-content:center;align-items:center;overflow:hidden}
canvas#gameCanvas{display:block;background:#111;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.8)}
#overlay{position:fixed;inset:0;background:rgba(10,10,20,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;z-index:99999;text-align:center;padding:20px}
.btn{background:linear-gradient(135deg,#ff416c,#ff4b2b);color:white;border:none;padding:16px 45px;font-size:1.3rem;font-weight:bold;border-radius:30px;cursor:pointer}
</style>
</head>
<body>
<video id="webcam" autoplay playsinline muted style="display:none"></video>
<div id="game-container">
<header>
<div id="camera-box">
<canvas id="webcam-preview"></canvas>
<svg id="roi-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon id="roi-poly" points="15,15 85,15 85,85 15,85" fill="rgba(255,215,0,0.18)" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4 3"/></svg>
<div class="handle" data-i="0"></div><div class="handle" data-i="1"></div><div class="handle" data-i="2"></div><div class="handle" data-i="3"></div>
</div>
<div class="stat-row">
<div class="stat-box">分數<span id="score">0</span></div>
<div class="stat-box">時間<span id="timer">02:00</span></div>
<div class="stat-box" id="cam-status" style="color:#aaa">後置鏡頭已就
