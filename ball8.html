<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>寶石方塊 - 大電視版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#game-container{display:flex;width:100vw;height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)}
header{width:220px;display:flex;flex-direction:column;background:rgba(0,0,0,0.6);border-right:2px solid rgba(255,255,255,0.1);padding:12px;gap:12px;z-index:10}
#camera-box{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden;border:2px solid #00ff00}
#webcam-preview{width:100%;height:100%;display:block;transform:scaleX(-1)}
#roi-box{position:absolute;border:2px dashed #ffd700;background:rgba(255,215,0,0.15);touch-action:none;cursor:move}
.stat-box{background:rgba(255,255,255,0.1);padding:10px;border-radius:10px;text-align:center;color:#fff;font-weight:bold}
.stat-box span{display:block;font-size:1.4rem;color:#ffd700;margin-top:4px}
.btn-small{width:100%;background:#222;color:#fff;border:1px solid #555;padding:8px;border-radius:8px;font-size:0.9rem}
#board-wrapper{flex:1;display:flex;justify-content:center;align-items:center;overflow:hidden}
canvas#gameCanvas{display:block;background:#111;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.8)}
#overlay{position:fixed;inset:0;background:rgba(10,10,20,0.95);display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;z-index:99999;text-align:center;padding:20px}
.btn{background:linear-gradient(135deg,#ff416c,#ff4b2b);color:white;border:none;padding:16px 45px;font-size:1.3rem;font-weight:bold;border-radius:30px;cursor:pointer}
</style>
</head>
<body>
<video id="webcam" autoplay playsinline muted style="display:none"></video>
<div id="game-container">
<header>
<div id="camera-box">
<canvas id="webcam-preview"></canvas>
<div id="roi-box"></div>
</div>
<button class="btn-small" id="calib-btn">↔️ 拖動黃框校準遊戲區</button>
<div class="stat-box">分數<span id="score">0</span></div>
<div class="stat-box">時間<span id="timer">02:00</span></div>
<div class="stat-box" style="font-size:0.8rem;color:#aaa">已用後置鏡頭<br>綠色球在黃框內移動</div>
</header>
<div id="board-wrapper"><canvas id="gameCanvas"></canvas></div>
</div>
<div id="overlay">
<h1>寶石方塊 - 大電視鏡像版</h1>
<p>1. 用Type-C/HDMI將手機Mirror到電視<br>2. 將手機後置鏡頭對住自己同個波<br>3. 拖動左邊黃框，對齊電視入面個遊戲板</p>
<button class="btn" id="start-btn">開啟後置鏡頭開始</button>
</div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),video=document.getElementById('webcam'),previewCanvas=document.getElementById('webcam-preview'),previewCtx=previewCanvas.getContext('2d');
const COLS=10,ROWS=7; let tileSize=40;
const GEM_COLORS=[{main:'#ff3366',light:'#ff8099',dark:'#cc0033'},{main:'#33ccff',light:'#80e5ff',dark:'#0099cc'},{main:'#33ff66',light:'#80ff99',dark:'#00cc33'},{main:'#ffcc00',light:'#ffe680',dark:'#cc9900'},{main:'#cc33ff',light:'#e680ff',dark:'#9900cc'}];
let board=[],score=0,timeLeft=120,gameInterval=null,isPlaying=false,particles=[],audioCtx=null,ballX=-100,ballY=-100,lastHitTime=0;
let roi={x:0.15,y:0.15,w:0.7,h:0.7}; // 相對座標 0-1
function initAudio(){if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume();}
function resizeCanvas(){const wrapper=document.getElementById('board-wrapper'); const maxW=wrapper.clientWidth-20,maxH=wrapper.clientHeight-20; tileSize=Math.floor(Math.min(maxW/COLS,maxH/ROWS)); canvas.width=COLS*tileSize; canvas.height=ROWS*tileSize; previewCanvas.width=320; previewCanvas.height=240;}
window.addEventListener('resize',resizeCanvas);
async function setupCamera(){
 // 後置鏡頭
 const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:"environment"},width:640,height:480}});
 video.srcObject=stream; await video.play(); requestAnimationFrame(trackLoop);
}
const procCanvas=document.createElement('canvas'),procCtx=procCanvas.getContext('2d',{willReadFrequently:true}); procCanvas.width=160; procCanvas.height=120;
function trackLoop(){
 if(video.readyState===video.HAVE_ENOUGH_DATA){
  previewCtx.save(); previewCtx.scale(-1,1); previewCtx.drawImage(video, -previewCanvas.width, 0, previewCanvas.width, previewCanvas.height); previewCtx.restore();
  // 只在ROI內檢測
  const rx=Math.floor(roi.x*procCanvas.width), ry=Math.floor(roi.y*procCanvas.height), rw=Math.floor(roi.w*procCanvas.width), rh=Math.floor(roi.h*procCanvas.height);
  procCtx.drawImage(video,0,0,procCanvas.width,procCanvas.height);
  const frame=procCtx.getImageData(rx,ry,rw,rh).data;
  let tx=0,ty=0,cnt=0;
  for(let i=0;i<frame.length;i+=4){const r=frame[i],g=frame[i+1],b=frame[i+2]; if(g>90&&r>80&&b<110&&(g-b)>30){ const idx=i/4; tx+=idx%rw; ty+=Math.floor(idx/rw); cnt++; }}
  if(cnt>20){
   const avgX=tx/cnt, avgY=ty/cnt;
   // 將ROI座標映射到整個遊戲板
   ballX=(1-(rx+avgX)/procCanvas.width)*canvas.width; // 因為mirror咗，要1-
   // 更精準映射：只映射ROI -> 全板
   const normX = 1 - (avgX / rw); // 在ROI內 0-1
   const normY = avgY / rh;
   ballX = normX * canvas.width;
   ballY = normY * canvas.height;
   if(isPlaying && Date.now()-lastHitTime>250){ checkHit(ballX,ballY); lastHitTime=Date.now(); }
  } else { ballX=-100; ballY=-100; }
  updateRoiBoxVisual();
 }
 requestAnimationFrame(trackLoop);
}
function checkHit(x,y){ const c=Math.floor(x/tileSize), r=Math.floor(y/tileSize); if(r>=0&&r<ROWS&&c>=0&&c<COLS&&board[r][c]!==null){ destroySingle(r,c); } }
function updateRoiBoxVisual(){ const box=document.getElementById('roi-box'); const parent=document.getElementById('camera-box'); box.style.left=(roi.x*100)+'%'; box.style.top=(roi.y*100)+'%'; box.style.width=(roi.w*100)+'%'; box.style.height=(roi.h*100)+'%'; }
// 拖動ROI
(function enableDrag(){
 const box=document.getElementById('roi-box'); const parent=document.getElementById('camera-box'); let drag=null;
 box.addEventListener('pointerdown',e=>{ drag={sx:e.clientX,sy:e.clientY,ox:roi.x,oy:roi.y}; box.setPointerCapture(e.pointerId); });
 window.addEventListener('pointermove',e=>{ if(!drag) return; const rect=parent.getBoundingClientRect(); const dx=(e.clientX-drag.sx)/rect.width; const dy=(e.clientY-drag.sy)/rect.height; roi.x=Math.min(0.8,Math.max(0,drag.ox+dx)); roi.y=Math.min(0.8,Math.max(0,drag.oy+dy)); });
 window.addEventListener('pointerup',()=>drag=null);
})();

async function startGame(){ document.getElementById('overlay').style.display='none'; try{ await setupCamera(); }catch(err){ alert('後置鏡頭開唔到，試試用前置: '+err); try{ const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}); video.srcObject=s; await video.play(); requestAnimationFrame(trackLoop);}catch(e){document.getElementById('overlay').style.display='flex'; return;}} initAudio(); score=0; timeLeft=120; document.getElementById('score').innerText=0; initBoard(); isPlaying=true; if(gameInterval) clearInterval(gameInterval); gameInterval=setInterval(()=>{timeLeft--; const m=Math.floor(timeLeft/60),s=timeLeft%60; document.getElementById('timer').innerText=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; if(timeLeft<=0) endGame();},1000); requestAnimationFrame(gameLoop); }
function endGame(){ isPlaying=false; clearInterval(gameInterval); document.getElementById('overlay').innerHTML=`<h1>結束</h1><p>得分 ${score}</p><button class="btn" onclick="location.reload()">再玩一次</button>`; document.getElementById('overlay').style.display='flex'; }
function initBoard(){ resizeCanvas(); board=[]; for(let r=0;r<ROWS;r++){board[r]=[]; for(let c=0;c<COLS;c++) board[r][c]=Math.floor(Math.random()*GEM_COLORS.length);} }
function destroySingle(r,c){ score+=10; document.getElementById('score').innerText=score; createParticles(c*tileSize+tileSize/2,r*tileSize+tileSize/2,GEM_COLORS[board[r][c]].main); board[r][c]=null; // 一格消除後掉落
 for(let rr=r; rr>0; rr--) board[rr][c]=board[rr-1][c]; board[0][c]=Math.floor(Math.random()*GEM_COLORS.length);
}
function createParticles(x,y,color){ for(let i=0;i<10;i++){ const a=Math.random()*Math.PI*2,s=Math.random()*4+2; particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,alpha:1,decay:0.04}); } }
function drawGem(x,y,size,obj){ ctx.save(); ctx.translate(x,y); const s=size*0.8; ctx.fillStyle=obj.main; ctx.beginPath(); ctx.arc(0,0,s/2.5,0,Math.PI*2); ctx.fill(); ctx.fillStyle=obj.light; ctx.beginPath(); ctx.arc(-s*0.15,-s*0.15,s*0.15,0,Math.PI*2); ctx.fill(); ctx.restore(); }
function update(){ for(let i=particles.length-1;i>=0;i--){ let p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.alpha-=p.decay; if(p.alpha<=0) particles.splice(i,1); } }
function draw(){ ctx.clearRect(0,0,canvas.width,canvas.height); for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ ctx.fillStyle=(r+c)%2?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.1)'; ctx.fillRect(c*tileSize,r*tileSize,tileSize,tileSize); if(board[r][c]!==null) drawGem(c*tileSize+tileSize/2,r*tileSize+tileSize/2,tileSize,GEM_COLORS[board[r][c]]); } for(let p of particles){ ctx.globalAlpha=p.alpha; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1; if(ballX>0){ ctx.strokeStyle='#00ff00'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(ballX,ballY,20,0,Math.PI*2); ctx.stroke(); } }
function gameLoop(){ update(); draw(); if(isPlaying) requestAnimationFrame(gameLoop); }
document.getElementById('start-btn').addEventListener('click', startGame);
resizeCanvas();
</script>
</body>
</html>
