<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>寶石方塊 - 終極Fix</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:sans-serif}
#game-container{display:flex;width:100vw;height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)}
header{width:240px;display:flex;flex-direction:column;background:rgba(0,0,0,.7);border-right:2px solid rgba(255,255,255,.1);padding:12px;gap:10px}
#camera-box{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden;border:2px solid #00ff00;touch-action:none}
#webcam-preview{width:100%;height:100%;display:block;transform:scaleX(-1)}
#roi-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.handle{position:absolute;width:28px;height:28px;background:#ffd700;border:3px solid #000;border-radius:50%;transform:translate(-50%,-50%);z-index:20}
.stat-box{background:rgba(255,255,255,.1);padding:8px;border-radius:10px;text-align:center;color:#fff;font-weight:bold}
.stat-box span{display:block;color:#ffd700}
#board-wrapper{flex:1;display:flex;justify-content:center;align-items:center;overflow:hidden}
canvas#gameCanvas{display:block;background:#111;border-radius:8px}
#overlay{position:fixed;inset:0;background:rgba(10,10,20,.97);display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;z-index:99999;text-align:center;padding:20px}
.btn{background:linear-gradient(135deg,#ff416c,#ff4b2b);color:white;border:none;padding:18px 50px;font-size:1.4rem;font-weight:bold;border-radius:30px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.95)}
</style>
</head>
<body>
<video id="webcam" autoplay playsinline muted style="display:none"></video>
<div id="game-container">
<header>
<div id="camera-box">
<canvas id="webcam-preview"></canvas>
<svg id="roi-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon id="roi-poly" points="15,12 85,12 88,88 12,88" fill="rgba(255,215,0,.18)" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4 3"/></svg>
<div class="handle" data-i="0" style="left:15%;top:12%"></div><div class="handle" data-i="1" style="left:85%;top:12%"></div><div class="handle" data-i="2" style="left:88%;top:88%"></div><div class="handle" data-i="3" style="left:12%;top:88%"></div>
</div>
<div class="stat-box">分數<span id="score">0</span></div>
<div class="stat-box">時間<span id="timer">02:00</span></div>
<div class="stat-box" id="cam-status" style="font-size:0.7rem;color:#0f0">狀態: 等待點擊</div>
</header>
<div id="board-wrapper"><canvas id="gameCanvas"></canvas></div>
</div>
<div id="overlay">
<h1 style="font-size:1.8rem">寶石方塊 - 梯形校正版</h1>
<p style="margin:12px 0;color:#aaa">用後置鏡頭對住電視<br>拖4黃點套住遊戲板，可梯形校正<br>支援雙指縮放</p>
<button class="btn" id="start-btn" onclick="window.startGame()">開啟後置鏡頭</button>
<p id="debug" style="color:#ff6666;margin-top:15px;font-size:.8rem"></p>
<p style="color:#666;margin-top:10px;font-size:.7rem">*如在WhatsApp內開啟，請按右上角用Chrome開啟，否則無鏡頭權限</p>
</div>
<script>
// 全局，確保按鈕一定搵到
window.quad=[{x:0.15,y:0.12},{x:0.85,y:0.12},{x:0.88,y:0.88},{x:0.12,y:0.88}];
let homography=null, board=[], score=0, timeLeft=120, gameInterval=null, isPlaying=false, particles=[], ballX=-100, ballY=-100, lastHitTime=0, tileSize=40;
const COLS=10, ROWS=7;
const GEM_COLORS=[{main:'#ff3366'},{main:'#33ccff'},{main:'#33ff66'},{main:'#ffcc00'},{main:'#cc33ff'}];
const canvas=document.getElementById('gameCanvas'), ctx=canvas.getContext('2d');
const video=document.getElementById('webcam'), previewCanvas=document.getElementById('webcam-preview'), previewCtx=previewCanvas.getContext('2d');
const procCanvas=document.createElement('canvas'), procCtx=procCanvas.getContext('2d',{willReadFrequently:true});
procCanvas.width=160; procCanvas.height=120;

function setStatus(t,c){ const el=document.getElementById('cam-status'); if(el){el.innerText=t; el.style.color=c||'#0f0';} }
function setDebug(t){ document.getElementById('debug').innerText=t; }

function resizeCanvas(){ const w=document.getElementById('board-wrapper'); const maxW=w.clientWidth-20,maxH=w.clientHeight-20; tileSize=Math.floor(Math.min(maxW/COLS,maxH/ROWS)); canvas.width=COLS*tileSize; canvas.height=ROWS*tileSize; previewCanvas.width=320; previewCanvas.height=240; updateHandles(); }
function updateHandles(){ const poly=document.getElementById('roi-poly'); if(!poly) return; poly.setAttribute('points', window.quad.map(p=>`${p.x*100},${p.y*100}`).join(' ')); document.querySelectorAll('.handle').forEach((el,i)=>{ el.style.left=(window.quad[i].x*100)+'%'; el.style.top=(window.quad[i].y*100)+'%'; }); computeHomography(); }
function computeHomography(){
 const src=window.quad.map(p=>({x:p.x*procCanvas.width, y:p.y*procCanvas.height}));
 const dst=[{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:0,y:1}];
 let A=[], b=[]; for(let i=0;i<4;i++){ const sx=src[i].x, sy=src[i].y, dx=dst[i].x, dy=dst[i].y; A.push([sx,sy,1,0,0,0,-dx*sx,-dx*sy]); b.push(dx); A.push([0,0,0,sx,sy,1,-dy*sx,-dy*sy]); b.push(dy); }
 let n=8; for(let i=0;i<n;i++){ let max=i; for(let r=i;r<n;r++) if(Math.abs(A[r][i])>Math.abs(A[max][i])) max=r; [A[i],A[max]]=[A[max],A[i]]; [b[i],b[max]]=[b[max],b[i]]; if(Math.abs(A[i][i])<1e-8) continue; for(let r=i+1;r<n;r++){ let f=A[r][i]/A[i][i]; for(let c=i;c<n;c++) A[r][c]-=f*A[i][c]; b[r]-=f*b[i]; } }
 let h=new Array(n).fill(0); for(let i=n-1;i>=0;i--){ let s=b[i]; for(let c=i+1;c<n;c++) s-=A[i][c]*h[c]; h[i]=Math.abs(A[i][i])<1e-8?0:s/A[i][i]; }
 homography={h00:h[0],h01:h[1],h02:h[2],h10:h[3],h11:h[4],h12:h[5],h20:h[6],h21:h[7],h22:1};
}
function mapPoint(x,y){ if(!homography) return null; const h=homography; const d=h.h20*x+h.h21*y+h.h22; if(Math.abs(d)<1e-6) return null; return {u:(h.h00*x+h.h01*y+h.h02)/d, v:(h.h10*x+h.h11*y+h.h12)/d}; }

// 核心：先開Game，再試相機，咁個掣一定有反應
window.startGame = function(){
 console.log('startGame clicked');
 setDebug('按鈕已點擊，正在啟動...');
 // 1. 立刻收overlay，開game
 document.getElementById('overlay').style.display='none';
 score=0; timeLeft=120; document.getElementById('score').innerText=0; initBoard(); isPlaying=true;
 if(gameInterval) clearInterval(gameInterval);
 gameInterval=setInterval(()=>{timeLeft--; const m=Math.floor(timeLeft/60),s=timeLeft%60; document.getElementById('timer').innerText=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; if(timeLeft<=0) endGame();},1000);
 requestAnimationFrame(gameLoop);
 // 2. 後台先試相機，唔阻塞
 setTimeout(tryCamera, 100);
}

async function tryCamera(){
 if(!navigator.mediaDevices ||!navigator.mediaDevices.getUserMedia){
   setStatus('鏡頭: 瀏覽器不支援','red'); setDebug('此瀏覽器不支援鏡頭，請用Chrome用https開啟'); return;
 }
 try{
   setStatus('鏡頭請求中...','#ff0');
   const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:640}}}).catch(async()=>{ return await navigator.mediaDevices.getUserMedia({video:true}); });
   video.srcObject=stream; await video.play(); setStatus('鏡頭: 已開啟 ✓','#0f0'); requestAnimationFrame(trackLoop);
 }catch(err){
   console.error(err); setStatus('鏡頭: 失敗 '+err.name,'red');
   setDebug('鏡頭失敗: '+err.name+' - '+err.message+'\n\n解決方法:\n1. 用Chrome開啟，不要用WhatsApp內置瀏覽器\n2. 必須用 https:// 開\n3. 按允許鏡頭權限');
 }
}
function trackLoop(){
 if(video.readyState>=2){
  previewCtx.save(); previewCtx.scale(-1,1); previewCtx.drawImage(video,-previewCanvas.width,0,previewCanvas.width,previewCanvas.height); previewCtx.restore();
  procCtx.drawImage(video,0,0,procCanvas.width,procCanvas.height);
  const data=procCtx.getImageData(0,0,procCanvas.width,procCanvas.height).data;
  let tx=0,ty=0,cnt=0; for(let i=0;i<data.length;i+=8){ const r=data[i],g=data[i+1],b=data[i+2]; if(g>90&&r>80&&b<110&&(g-b)>30){ const idx=i/4; tx+=idx%procCanvas.width; ty+=Math.floor(idx/procCanvas.width); cnt++; } }
  if(cnt>15){ const avgX=tx/cnt, avgY=ty/cnt; const m=mapPoint(avgX,avgY); if(m && m.u>=0&&m.u<=1&&m.v>=0&&m.v<=1){ ballX=(1-m.u)*canvas.width; ballY=m.v*canvas.height; if(Date.now()-lastHitTime>250){ checkHit(ballX,ballY); lastHitTime=Date.now(); } } }
 }
 requestAnimationFrame(trackLoop);
}
function checkHit(x,y){ const c=Math.floor(x/tileSize), r=Math.floor(y/tileSize); if(r>=0&&r<ROWS&&c>=0&&c<COLS&&board[r][c]!==null) destroySingle(r,c); }
function initBoard(){ resizeCanvas(); board=[]; for(let r=0;r<ROWS;r++){board[r]=[]; for(let c=0;c<COLS;c++) board[r][c]=Math.floor(Math.random()*GEM_COLORS.length);} }
function destroySingle(r,c){ score+=10; document.getElementById('score').innerText=score; board[r][c]=null; for(let rr=r; rr>0; rr--) board[rr][c]=board[rr-1][c]; board[0][c]=Math.floor(Math.random()*GEM_COLORS.length); }
function drawGem(x,y,size,obj){ ctx.fillStyle=obj.main; ctx.beginPath(); ctx.arc(x,y,size*0.32,0,Math.PI*2); ctx.fill(); }
function gameLoop(){ ctx.clearRect(0,0,canvas.width,canvas.height); for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ if(board[r][c]!==null) drawGem(c*tileSize+tileSize/2,r*tileSize+tileSize/2,tileSize,GEM_COLORS[board[r][c]]); } if(ballX>0){ ctx.strokeStyle='#0f0'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(ballX,ballY,20,0,Math.PI*2); ctx.stroke(); } if(isPlaying) requestAnimationFrame(gameLoop); }
function endGame(){ isPlaying=false; clearInterval(gameInterval); document.getElementById('overlay').style.display='flex'; document.getElementById('overlay').innerHTML=`<h1>結束 ${score}分</h1><button class="btn" onclick="location.reload()">再玩</button>`; }

// 拖角 + pinch
(function(){
 const box=document.getElementById('camera-box'); let active=-1;
 document.querySelectorAll('.handle').forEach(h=>{ h.addEventListener('pointerdown',e=>{ active=parseInt(h.dataset.i); h.setPointerCapture(e.pointerId); }); });
 window.addEventListener('pointermove',e=>{ if(active>=0){ const r=box.getBoundingClientRect(); window.quad[active]={x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)), y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}; updateHandles(); } });
 window.addEventListener('pointerup',()=>active=-1);
 let lastDist=0, pinchStart=null;
