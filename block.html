<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>寶石方塊連消遊戲</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        }
        header {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        #board-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
        }
        canvas {
            display: block;
            touch-action: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 12px;
        }
        /* 結算 / 開始 覆蓋層 */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        #overlay h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        #overlay p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #ddd;
        }
        .btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(255, 65, 108, 0.4);
        }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <div class="stat-box">分數: <span id="score">0</span></div>
        <div class="stat-box">時間: <span id="timer">02:00</span></div>
    </header>
    <div id="board-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>
</div>

<div id="overlay">
    <h1 id="overlay-title">寶石方塊連消</h1>
    <p id="overlay-desc">點擊 4 個或以上相連同色寶石，或點擊任意寶石消除其相連同色群組！限時 2 分鐘爭取最高分！</p>
    <button class="btn" id="start-btn" onclick="startGame()">開始遊戲</button>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const COLS = 7;
    const ROWS = 9;
    let tileSize = 45;

    // 寶石顏色設定 (5 種顏色)
    const GEM_COLORS = [
        { main: '#ff3366', light: '#ff8099', dark: '#cc0033', shape: 'diamond' }, // 紅
        { main: '#33ccff', light: '#80e5ff', dark: '#0099cc', shape: 'circle' },  // 藍
        { main: '#33ff66', light: '#80ff99', dark: '#00cc33', shape: 'square' },  // 綠
        { main: '#ffcc00', light: '#ffe680', dark: '#cc9900', shape: 'star' },    // 黃
        { main: '#cc33ff', light: '#e680ff', dark: '#9900cc', shape: 'triangle' }// 紫
    ];

    let board = [];
    let score = 0;
    let timeLeft = 120;
    let gameInterval = null;
    let isPlaying = false;
    let particles = [];
    let animations = []; // 用於掉落動畫

    // Web Audio 簡單合成音效
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'match') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(600, now + 0.1);
                osc.frequency.setValueAtTime(900, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.5);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        } catch(e) {}
    }

    // 自動調整畫布大小以適應全螢幕
    function resizeCanvas() {
        const wrapper = document.getElementById('board-wrapper');
        const maxWidth = wrapper.clientWidth - 20;
        const maxHeight = wrapper.clientHeight - 20;
        
        tileSize = Math.floor(Math.min(maxWidth / COLS, maxHeight / ROWS));
        canvas.width = COLS * tileSize;
        canvas.height = ROWS * tileSize;
    }
    window.addEventListener('resize', resizeCanvas);

    function startGame() {
        initAudio();
        document.getElementById('overlay').style.display = 'none';
        score = 0;
        timeLeft = 120;
        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = '02:00';
        
        initBoard();
        isPlaying = true;
        
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(() => {
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function endGame() {
        isPlaying = false;
        clearInterval(gameInterval);
        playSound('gameover');
        
        document.getElementById('overlay-title').innerText = '時間到！遊戲結束';
        document.getElementById('overlay-desc').innerText = `最終得分：${score} 分`;
        document.getElementById('start-btn').innerText = '重新開始';
        document.getElementById('overlay').style.display = 'flex';
    }

    function initBoard() {
        resizeCanvas();
        board = [];
        for (let r = 0; r < ROWS; r++) {
            board[r] = [];
            for (let c = 0; c < COLS; c++) {
                board[r][c] = Math.floor(Math.random() * GEM_COLORS.length);
            }
        }
        // 初始確保沒有剛好連線的局面
        resolveMatchesInstant();
    }

    // 瞬間消除初始連線
    function resolveMatchesInstant() {
        let matched;
        do {
            matched = findMatches();
            if (matched.length > 0) {
                matched.forEach(pos => {
                    board[pos.r][pos.c] = Math.floor(Math.random() * GEM_COLORS.length);
                });
            }
        } while (matched.length > 0);
    }

    // 尋找全盤連線 (4個或以上同色相連)
    function findMatches() {
        let visited = Array(ROWS).fill(0).map(() => Array(COLS).fill(false));
        let allMatches = [];

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (board[r][c] !== null && !visited[r][c]) {
                    let group = getConnectedGroup(r, c, board[r][c], visited);
                    if (group.length >= 4) {
                        allMatches.push(...group);
                    }
                }
            }
        }
        return allMatches;
    }

    // Flood-Fill 尋找相連同色寶石群
    function getConnectedGroup(r, c, color, visited) {
        let group = [];
        let stack = [{r, c}];
        while (stack.length > 0) {
            let curr = stack.pop();
            let cr = curr.r;
            let cc = curr.c;
            
            if (cr < 0 || cr >= ROWS || cc < 0 || cc >= COLS) continue;
            if (visited[cr][cc]) continue;
            if (board[cr][cc] !== color) continue;
            
            visited[cr][cc] = true;
            group.push({r: cr, c: cc});
            
            stack.push({r: cr + 1, c: cc});
            stack.push({r: cr - 1, c: cc});
            stack.push({r: cr, c: cc + 1});
            stack.push({r: cr, c: cc - 1});
        }
        return group;
    }

    // 點擊處理：點擊任何寶石，消除其「相連同色群組」
    canvas.addEventListener('click', (e) => {
        if (!isPlaying) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const c = Math.floor(x / tileSize);
        const r = Math.floor(y / tileSize);
        
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] !== null) {
            clickedGem(r, c);
        }
    });

    // 觸控支援
    canvas.addEventListener('touchend', (e) => {
        if (!isPlaying) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const touch = e.changedTouches[0];
        const x = touch.clientX - rect.left;
        const y = touch.clientY - rect.top;
        
        const c = Math.floor(x / tileSize);
        const r = Math.floor(y / tileSize);
        
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] !== null) {
            clickedGem(r, c);
        }
    }, {passive: false});

    function clickedGem(r, c) {
        let color = board[r][c];
        let visited = Array(ROWS).fill(0).map(() => Array(COLS).fill(false));
        let group = getConnectedGroup(r, c, color, visited);
        
        // 點擊消除相連同色群組
        if (group.length > 0) {
            destroyGroup(group);
        }
    }

    function destroyGroup(group) {
        score += group.length * 10;
        document.getElementById('score').innerText = score;
        playSound('pop');

        group.forEach(pos => {
            createParticles(pos.c * tileSize + tileSize / 2, pos.r * tileSize + tileSize / 2, GEM_COLORS[board[pos.r][pos.c]].main);
            board[pos.r][pos.c] = null;
        });

        applyGravityAndRefill();
    }

    // 檢查並自動消除達到 4 個或以上的自動連線
    function checkAndProcessAutomaticMatches() {
        let matches = findMatches();
        if (matches.length > 0) {
            score += matches.length * 15;
            document.getElementById('score').innerText = score;
            playSound('match');

            matches.forEach(pos => {
                if (board[pos.r][pos.c] !== null) {
                    createParticles(pos.c * tileSize + tileSize / 2, pos.r * tileSize + tileSize / 2, GEM_COLORS[board[pos.r][pos.c]].main);
                    board[pos.r][pos.c] = null;
                }
            });

            applyGravityAndRefill();
        }
    }

    // 掉落與補滿
    function applyGravityAndRefill() {
        for (let c = 0; c < COLS; c++) {
            let writeRow = ROWS - 1;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r][c] !== null) {
                    let temp = board[r][c];
                    board[r][c] = null;
                    board[writeRow][c] = temp;
                    writeRow--;
                }
            }
            // 補齊上方空格
            for (let r = writeRow; r >= 0; r--) {
                board[r][c] = Math.floor(Math.random() * GEM_COLORS.length);
            }
        }

        // 延遲連鎖檢查自動消除
        setTimeout(() => {
            if (isPlaying) {
                checkAndProcessAutomaticMatches();
            }
        }, 200);
    }

    // 粒子爆炸效果
    function createParticles(x, y, color) {
        for (let i = 0; i < 12; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 4 + 2;
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                color: color,
                alpha: 1,
                decay: Math.random() * 0.03 + 0.02
            });
        }
    }

    // 繪製寶石形狀
    function drawGem(x, y, size, colorObj) {
        ctx.save();
        ctx.translate(x, y);
        
        const s = size * 0.82;
        const half = s / 2;

        // 陰影
        ctx.shadowColor = 'rgba(0,0,0,0.4)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 3;

        // 渐变底色
        const grad = ctx.createRadialGradient(-s*0.2, -s*0.2, s*0.1, 0, 0, s);
        grad.addColorStop(0, colorObj.light);
        grad.addColorStop(1, colorObj.dark);
        ctx.fillStyle = grad;

        if (colorObj.shape === 'diamond') {
            ctx.beginPath();
            ctx.moveTo(0, -half);
            ctx.lineTo(half, 0);
            ctx.lineTo(0, half);
            ctx.lineTo(-half, 0);
            ctx.closePath();
            ctx.fill();
        } else if (colorObj.shape === 'circle') {
            ctx.beginPath();
            ctx.arc(0, 0, half * 0.85, 0, Math.PI * 2);
            ctx.fill();
        } else if (colorObj.shape === 'square') {
            ctx.beginPath();
            ctx.roundRect(-half * 0.8, -half * 0.8, s * 0.8, s * 0.8, 6);
            ctx.fill();
        } else if (colorObj.shape === 'star') {
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                ctx.lineTo(Math.abs((i * Math.PI) / 2.5) ? Math.cos((i * 4 * Math.PI) / 5) * half : 0, Math.sin((i * 4 * Math.PI) / 5) * half);
            }
            // 簡化用精美圓角六角替代星形或常規多邊形
            ctx.beginPath();
            ctx.arc(0, 0, half * 0.8, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // triangle
            ctx.beginPath();
            ctx.moveTo(0, -half);
            ctx.lineTo(half, half * 0.8);
            ctx.lineTo(-half, half * 0.8);
            ctx.closePath();
            ctx.fill();
        }

        // 高光反射
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.beginPath();
        ctx.arc(-half * 0.3, -half * 0.3, half * 0.25, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    // 主遊戲循環
    function update() {
        // 更新粒子
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= p.decay;
            if (p.alpha <= 0) {
                particles.splice(i, 1);
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 畫棋盤格子底紋
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                ctx.fillStyle = (r + c) % 2 === 0 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.1)';
                ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
                
                // 寶石
                if (board[r] && board[r][c] !== null) {
                    let colorIdx = board[r][c];
                    drawGem(
                        c * tileSize + tileSize / 2,
                        r * tileSize + tileSize / 2,
                        tileSize,
                        GEM_COLORS[colorIdx]
                    );
                }
            }
        }

        // 畫粒子
        particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // 初始化畫布尺寸並開始渲染循環
    resizeCanvas();
    loop();
</script>

</body>
</html>
